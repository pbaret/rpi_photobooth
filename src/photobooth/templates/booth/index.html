<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ booth_name }}</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #171a18;
        color: #f5f6f3;
      }

      * { box-sizing: border-box; }

      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }

      body { min-height: 100dvh; }

      .booth {
        position: relative;
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100dvh;
        padding: max(12px, env(safe-area-inset-top)) 16px
          max(12px, env(safe-area-inset-bottom));
        gap: 12px;
      }

      header { flex: 0 0 auto; text-align: center; }
      h1 { margin: 0; font-size: 1.25rem; }

      .preview {
        position: relative;
        display: grid;
        flex: 1 1 auto;
        min-height: 0;
        place-items: center;
        overflow: hidden;
        background: #050605;
      }

      .preview img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .shade {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 20px;
        background: rgb(0 0 0 / 58%);
        text-align: center;
      }

      .shade[hidden], [hidden] { display: none; }

      .slideshow {
        position: fixed;
        z-index: 10;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #050605;
        touch-action: manipulation;
      }

      .slideshow[hidden] { display: none; }

      .slideshow img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .slideshow p {
        position: absolute;
        right: max(20px, env(safe-area-inset-right));
        bottom: max(20px, env(safe-area-inset-bottom));
        left: max(20px, env(safe-area-inset-left));
        margin: 0;
        padding: 14px 18px;
        background: rgb(0 0 0 / 76%);
        color: #fff;
        font-size: clamp(1.1rem, 4vh, 2rem);
        font-weight: 700;
        text-align: center;
      }

      .countdown-value {
        display: block;
        font-size: clamp(5rem, 20vh, 12rem);
        font-weight: 700;
        line-height: 1;
      }

      .state-label { margin: 12px 0 0; font-size: 1.5rem; }

      footer {
        display: grid;
        flex: 0 0 auto;
        min-height: 64px;
        place-items: center;
      }

      button {
        min-width: min(100%, 320px);
        min-height: 56px;
        padding: 12px 24px;
        border: 0;
        border-radius: 4px;
        background: #f1c84b;
        color: #171a18;
        font: inherit;
        font-size: 1.2rem;
        font-weight: 700;
        cursor: pointer;
        touch-action: manipulation;
      }

      button:disabled { cursor: wait; opacity: 0.7; }
      button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

      .error-panel {
        display: grid;
        gap: 12px;
        justify-items: center;
        text-align: center;
      }

      .error-panel p { margin: 0; font-size: 1.1rem; }

      @media (orientation: landscape) {
        .booth { padding-left: 24px; padding-right: 24px; }
        header { text-align: left; }
        footer { min-height: 72px; }
      }
    </style>
  </head>
  <body>
    <main class="booth" id="booth" data-state="idle"
      data-countdown-seconds="{{ countdown_seconds }}"
      data-idle-timeout-seconds="{{ idle_timeout_seconds }}"
      data-slideshow-enabled="{{ 'true' if slideshow_enabled else 'false' }}"
      data-slideshow-interval-seconds="{{ slideshow_interval_seconds }}"
      data-slideshow-feed-url="{{ url_for('booth.slideshow_photos') }}">
      <header><h1>{{ booth_name }}</h1></header>
      <section class="preview" aria-label="Aperçu caméra">
        <img id="preview" src="{{ url_for('booth.preview') }}" alt="Aperçu caméra en direct">
        <div class="shade" id="countdown-panel" hidden>
          <div>
            <output class="countdown-value" id="countdown-value" aria-live="assertive">3</output>
            <p class="state-label">Préparez-vous</p>
          </div>
        </div>
        <div class="shade" id="capturing-panel" hidden>
          <p class="state-label" role="status">Prise de vue en cours...</p>
        </div>
        <div class="shade" id="error-panel" hidden>
          <div class="error-panel">
            <p role="alert">La prise de vue n'a pas pu aboutir.</p>
            <button id="return-button" type="button">Retour</button>
          </div>
        </div>
      </section>
      <footer>
        <button id="capture-button" type="button">Prendre une photo</button>
        {% if notice %}<p id="state-message" role="status">{{ notice }}</p>{% endif %}
      </footer>
      <section class="slideshow" id="slideshow-panel" aria-label="Diaporama" hidden>
        <img id="slideshow-image" alt="" hidden>
        <p role="status">Touchez l'écran pour démarrer</p>
      </section>
    </main>
    <script>
      const booth = document.getElementById("booth");
      const preview = document.getElementById("preview");
      const captureButton = document.getElementById("capture-button");
      const returnButton = document.getElementById("return-button");
      const countdownPanel = document.getElementById("countdown-panel");
      const countdownValue = document.getElementById("countdown-value");
      const capturingPanel = document.getElementById("capturing-panel");
      const errorPanel = document.getElementById("error-panel");
      const slideshowPanel = document.getElementById("slideshow-panel");
      const slideshowImage = document.getElementById("slideshow-image");
      const countdownSeconds = Number(booth.dataset.countdownSeconds);
      const idleTimeoutSeconds = Number(booth.dataset.idleTimeoutSeconds);
      const slideshowEnabled = booth.dataset.slideshowEnabled === "true";
      const slideshowIntervalSeconds = Number(booth.dataset.slideshowIntervalSeconds);
      const slideshowFeedUrl = booth.dataset.slideshowFeedUrl;
      let inactivityTimer = 0;
      let rotationTimer = 0;
      let refreshTimer = 0;
      let slideshowThumbnails = [];
      let slideshowIndex = 0;
      let feedRequestInProgress = false;

      function setState(state) {
        booth.dataset.state = state;
        countdownPanel.hidden = state !== "countdown";
        capturingPanel.hidden = state !== "capturing";
        errorPanel.hidden = state !== "error";
        slideshowPanel.hidden = state !== "slideshow";
        captureButton.hidden = state !== "idle";
        captureButton.disabled = state !== "idle";
        if (state === "idle") scheduleInactivity();
        else window.clearTimeout(inactivityTimer);
      }

      function scheduleInactivity() {
        window.clearTimeout(inactivityTimer);
        if (slideshowEnabled && idleTimeoutSeconds > 0 && booth.dataset.state === "idle") {
          inactivityTimer = window.setTimeout(enterSlideshow, idleTimeoutSeconds * 1000);
        }
      }

      function showSlideshowPhoto() {
        if (booth.dataset.state !== "slideshow" || slideshowThumbnails.length === 0) {
          slideshowImage.hidden = true;
          slideshowImage.removeAttribute("src");
          return;
        }
        slideshowImage.hidden = false;
        slideshowImage.src = slideshowThumbnails[slideshowIndex];
        slideshowIndex = (slideshowIndex + 1) % slideshowThumbnails.length;
      }

      function shuffleThumbnails(thumbnails) {
        const originalOrder = [...thumbnails];
        for (let index = thumbnails.length - 1; index > 0; index -= 1) {
          const swapIndex = Math.floor(Math.random() * (index + 1));
          [thumbnails[index], thumbnails[swapIndex]] = [
            thumbnails[swapIndex],
            thumbnails[index],
          ];
        }
        if (
          thumbnails.length > 1 &&
          thumbnails.every((thumbnail, index) => thumbnail === originalOrder[index])
        ) {
          [thumbnails[0], thumbnails[1]] = [thumbnails[1], thumbnails[0]];
        }
        return thumbnails;
      }

      async function refreshSlideshowPhotos() {
        if (feedRequestInProgress || booth.dataset.state !== "slideshow") return;
        feedRequestInProgress = true;
        try {
          const response = await fetch(slideshowFeedUrl, { cache: "no-store" });
          if (!response.ok) throw new Error("slideshow feed unavailable");
          const payload = await response.json();
          if (!Array.isArray(payload.thumbnails)) throw new Error("invalid slideshow feed");
          slideshowThumbnails = shuffleThumbnails(
            payload.thumbnails.filter((url) => typeof url === "string")
          );
          slideshowIndex = 0;
          showSlideshowPhoto();
        } catch {
          slideshowThumbnails = [];
          showSlideshowPhoto();
        } finally {
          feedRequestInProgress = false;
        }
      }

      function enterSlideshow() {
        if (!slideshowEnabled || booth.dataset.state !== "idle") return;
        setState("slideshow");
        void refreshSlideshowPhotos();
        rotationTimer = window.setInterval(showSlideshowPhoto, slideshowIntervalSeconds * 1000);
        refreshTimer = window.setInterval(refreshSlideshowPhotos, 60000);
      }

      function exitSlideshow() {
        window.clearInterval(rotationTimer);
        window.clearInterval(refreshTimer);
        slideshowThumbnails = [];
        slideshowImage.hidden = true;
        slideshowImage.removeAttribute("src");
        setState("idle");
      }

      // Activity resets inactivity only in IDLE. During SLIDESHOW the first
      // pointer, keyboard, or wheel event is consumed; capture countdown work
      // owns separate timers and is never advanced by the inactivity timer.
      function handleActivity(event) {
        if (booth.dataset.state === "slideshow") {
          event.preventDefault();
          event.stopImmediatePropagation();
          exitSlideshow();
          return;
        }
        if (booth.dataset.state === "idle") scheduleInactivity();
      }

      for (const eventName of ["pointerdown", "pointermove", "keydown", "wheel"]) {
        document.addEventListener(eventName, handleActivity, { capture: true });
      }

      function wait(milliseconds) {
        return new Promise((resolve) => window.setTimeout(resolve, milliseconds));
      }

      function resumePreview() {
        preview.src = "{{ url_for('booth.preview') }}?refresh=" + Date.now();
      }

      async function startCapture() {
        setState("countdown");
        const request = fetch("{{ url_for('booth.capture') }}", { method: "POST" });
        for (let remaining = countdownSeconds; remaining > 0; remaining -= 1) {
          countdownValue.value = String(remaining);
          countdownValue.textContent = String(remaining);
          await wait(1000);
        }
        setState("capturing");
        try {
          const response = await request;
          if (!response.ok) throw new Error("capture failed");
          const result = await response.json();
          if (typeof result.review_url !== "string" || !result.review_url.startsWith("/review/")) {
            throw new Error("review URL is invalid");
          }
          window.location.assign(result.review_url);
        } catch {
          setState("error");
        }
      }

      captureButton.addEventListener("click", () => { void startCapture(); });
      returnButton.addEventListener("click", () => {
        setState("idle");
        resumePreview();
      });
      slideshowImage.addEventListener("error", () => { slideshowImage.hidden = true; });
      window.addEventListener("pageshow", scheduleInactivity);
      setState("idle");
    </script>
  </body>
</html>
